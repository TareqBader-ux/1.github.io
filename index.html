<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator/title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <button style="font-size: 10px; background: transparent; opacity: 0;"><a href="./cheat.html" >cheats</a></button>
    <h1 style="display: flex; flex-direction: column; align-items: center; justify-content: center;">Calculator</h1>
    
    <input type="text" readonly id="inp">
    
    <div class="numb" style="display: flex; flex-direction: row; align-items: center; justify-content: center;">
        <div class="num1">
        <button value="1" onclick="document.getElementById('inp').value += this.value">1</button>
        <button value="2" onclick="document.getElementById('inp').value += this.value">2</button>
        <button value="3" onclick="document.getElementById('inp').value += this.value">3</button>
        </div>

        <div class="num2">
        <button value="4" onclick="document.getElementById('inp').value += this.value">4</button>
        <button value="5" onclick="document.getElementById('inp').value += this.value">5</button>
        <button value="6" onclick="document.getElementById('inp').value += this.value">6</button>
        </div>

        <div class="num3">
        <button value="7" onclick="document.getElementById('inp').value += this.value">7</button>
        <button value="8" onclick="document.getElementById('inp').value += this.value">8</button>
        <button value="9" onclick="document.getElementById('inp').value += this.value">9</button>
        </div>
        <div class="num0">
            <button value="0" onclick="document.getElementById('inp').value += this.value">0</button>
        </div>

                    <button value="/" onclick="document.getElementById('inp').value += this.value">/</button>
            <button value="*" onclick="document.getElementById('inp').value += this.value">x</button>
            <button value="-" onclick="document.getElementById('inp').value += this.value">-</button>
            <button value="+" onclick="document.getElementById('inp').value += this.value">+</button>
            <button onclick="document.getElementById('inp').value = ''">C</button>
            <button onclick="Calculate()">=</button>
        

    </div>
    <script>
        function Calculate() {
            let inpElement = document.getElementById("inp");
            try {
                // Evaluates the string math inside the input field directly
                inpElement.value = Function('"use strict";return (' + inpElement.value + ')')();
            } catch (e) {
                inpElement.value = "Err Unknown";
            }

                    if (inpElement.value==="1999") {
                window.location.href = "https://crazygames.com";
            }  else if (inpElement.value==="1777") {
                window.location.href = "https://yandex.com/game/";
            }  else if (inpElement.value==="911") {
                window.location.href = "https://Tareqbader-ux.github.io/ta.github.io";
            } else if (inpElement.value==="1976") {
                window.location.href = "https://yandex.ru/game/";
            }  else if (inpElement.value==="1666") {
                window.location.href = "https://mrcbrbn1.github.io/index.html";
            }  else if (inpElement.value==="1987") {
                window.location.href = "https://fnafgames.io/"
            }  else if (inpElement.value==="9109") {
                window.location.href = "https://ubghyper.github.io/"
            }
        }
    </script>
</body>
</html>
